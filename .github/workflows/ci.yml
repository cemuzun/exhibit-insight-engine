name: CI

on:
  push:
  pull_request:

jobs:
  verify-ai:
    name: Verify required packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run npm run verify:ai
        run: npm run verify:ai

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: verify-ai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      - name: Prettier format check
        run: bun run format:check

  check:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    needs: [verify-ai, lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Production build
        run: bun run build

